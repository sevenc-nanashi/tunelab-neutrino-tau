name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  pack:
    name: Pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $description = Get-Content -LiteralPath "description.json" -Raw | ConvertFrom-Json
          $description.version = $version
          $description | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "description.json" -Encoding utf8

      - name: Pack extension
        shell: pwsh
        env:
          PACKAGE_NAME: tunelab-neutrino-tau-${{ inputs.version }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: rake pack

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tunelab-neutrino-tau-${{ inputs.version }}-${{ matrix.os }}
          path: artifacts/tunelab-neutrino-tau-${{ inputs.version }}-*.tlx
          if-no-files-found: error

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: tunelab-neutrino-tau-${{ inputs.version }}-*
          merge-multiple: true

      - name: Check if version is a prerelease
        id: check_prerelease
        shell: bash
        run: |
          if [[ "${{ inputs.version }}" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
          files: artifacts/tunelab-neutrino-tau-${{ inputs.version }}-*.tlx
          generate_release_notes: true
